      Green Nursery Registration:
    </h1>
<hr/>
<img src="./../image/online-registration.png"height="70"/>
    <form>
        <table>
            <tr>
                <td>Full Name:</td>
                <td><input type="text" placeholder="Enter your name"></td>
            </tr>

            <tr>
                <td>Email:</td>
                <td><input type="email" placeholder="Enter email"></td>
            </tr>

            <tr>
                <td>Mobile No:</td>
                <td><input type="tel" placeholder="Enter mobile number"></td>
            </tr>

            <tr>
                <td>Address:</td>
                <td><textarea rows="3" cols="20"></textarea></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" placeholder="Enter password"></td>
            </tr>

            <tr>
                <td>Confirm Password:</td>
                <td><input type="password" placeholder="Confirm password"></td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>
